# Reconstruction settings for the FusionPortableV2 handheld rig (STIM300,
# Ouster OS1-128), from the trial on handheld_underground00 (2026-10-14).
# Use with: recon --config this.yaml (after convert with
# fusionportable_v2_handheld.yaml).
#
# Tactical-grade IMU (STIM300): turn-on accelerometer bias of a few mg. On a
# long straight walk the horizontal accelerometer bias cannot be told from a
# tilt, and the default (consumer-grade) prior of 0.2 m/s^2 let the bias
# absorb the LiDAR pitch drift (path tilted by 3 %).
imu_grade: tactical
# The plane BA bent this 400 m loop-free corridor by +-2 m vertically against
# the tracker ground truth, with or without IMU factors, and also with
# range / incidence weighting (ba.angular_sigma). That was with returns from
# 1 m on; on the Mandeye and Oxford Spires handheld rigs the cause was the
# dense near returns (ba.min_range, now 5 m by default), see README 4.3.
# Kept off until this rig is re-run with the new default.
ba:
  enabled: false
# A person, not a car: the walked path is not cleared at car width.
map:
  dynamic:
    ego_radius: 0.0
# 1800+ images per camera: label every 10th.
frames:
  frame_stride: 10
