# FusionPortableV2 handheld multi-sensor suite (Jiao et al., IJRR 2024):
# Ouster OS1-128, STIM300 IMU, stereo FLIR BFS-U3-31S4C (1024 x 768), INS.
# Calibration: github.com/fusionportable/calibration_files, 20230426_calib
# (identical to 20230618_calib and 20230912_calib; the handheld sequences of
# August 2023 fall between them). Their files give T^sensor_body_imu
# (body_imu in the sensor frame), hence `invert: true` below.
#
# The rig is carried, not driven: the vehicle frame is levelled with the
# gravity the IMU measures at the start and put on the floor below the IMU.
garage_id: hkust_gz_underground
reference: body_imu
vehicle:
  level: true
  floor: auto
  forward: [1.0, 0.0, 0.0]   # Ouster / STIM300 x points forward.
  level_window: 1.0
lidars:
  ouster00:
    topic: /os_cloud_node/points
    T_reference_sensor:      # ouster00.yaml: quaternion/translation_sensor_body_imu
      quaternion_wxyz: [0.999989, 0.000659, -0.001855, 0.004155]
      translation: [-0.035980, 0.017385, -0.033028]
      invert: true
    stamp: end               # "timestamp of this message = the last point"
    time_field: t            # ns since the first column
    time_scale: 1.0e-9
    intensity_field: reflectivity
    intensity_scale: 0.01
    min_range: 0.8           # The operator's hands and body.
    max_range: 60.0
    storage_step: 0.002
    sweep_duration: 0.1
    # The Ouster clock is not tied to the STIM300's: the offset changes
    # between recordings (2-82 ms on the Ouster IMU) and drifts within one.
    # Estimated per recording from the Ouster IMU (same clock as the
    # sweeps) against the STIM300.
    time_offset: 0.0
    clock_sync:
      imu_topic: /os_cloud_node/imu/data_raw
      # Ouster IMU stamps vs its sweeps, a constant of the OS1-128: the
      # sharpest map and the lowest IMU chi2 at -22 ms on ugv_parking00, 02
      # and 03, whose clock offsets differ by 45 ms.
      imu_delay: -0.022
      window: 20.0
      model: piecewise
imu:
  topic: /stim300/imu/data_raw
  accel_scale: 1.0
cameras:
  frame_cam00:
    topic: /stereo/frame_left/image_raw/compressed
    model: pinhole
    width: 1024
    height: 768
    params: [601.261780, 601.177307, 516.623047, 395.985901,
             -0.0897810012, 0.0848949999, 0.000813000021, 0.000437000010]
    T_reference_sensor:      # frame_cam00.yaml (Kalibr)
      quaternion_wxyz: [0.502578, 0.494366, -0.505169, 0.497815]
      translation: [0.069308, -0.019229, -0.084857]
      invert: true
    time_offset: -0.013618216766727708   # t_body_imu = t_cam + timeshift
    max_rate: 5.0
  frame_cam01:
    topic: /stereo/frame_right/image_raw/compressed
    model: pinhole
    width: 1024
    height: 768
    params: [600.813110, 600.947510, 516.493713, 388.550903,
             -0.0913790017, 0.0861390010, 0.000284000009, -0.000190999999]
    T_reference_sensor:
      quaternion_wxyz: [0.496518, 0.503561, -0.501849, 0.498038]
      translation: [-0.090698, -0.017608, -0.086397]
      invert: true
    time_offset: -0.01386046589177228
    max_rate: 5.0
stereo_pairs: [[frame_cam00, frame_cam01]]
